name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows x64 ──────────────────────────────────────────
          - os: windows-latest
            label: windows-x64
            cloudflared-url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
            cloudflared-bin: src-tauri/binaries/cloudflared-x86_64-pc-windows-msvc.exe
            tauri-args: ""

          # ── Linux x64 ────────────────────────────────────────────
          - os: ubuntu-22.04
            label: linux-x64
            cloudflared-url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            cloudflared-bin: src-tauri/binaries/cloudflared-x86_64-unknown-linux-gnu
            tauri-args: ""

          # ── macOS Apple Silicon (arm64) ───────────────────────────
          - os: macos-latest
            label: macos-arm64
            rust-target: aarch64-apple-darwin
            cloudflared-url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64
            cloudflared-bin: src-tauri/binaries/cloudflared-aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin"

          # ── macOS Intel (x64) ────────────────────────────────────
          - os: macos-13
            label: macos-x64
            rust-target: x86_64-apple-darwin
            cloudflared-url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64
            cloudflared-bin: src-tauri/binaries/cloudflared-x86_64-apple-darwin
            tauri-args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      # ── Linux system deps ─────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # ── Tauri CLI ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # ── Download cloudflared sidecar ──────────────────────────
      - name: Download cloudflared
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -L "${{ matrix.cloudflared-url }}" -o "${{ matrix.cloudflared-bin }}"
          chmod +x "${{ matrix.cloudflared-bin }}" || true

      # ── Build ─────────────────────────────────────────────────
      - name: Build Tauri app
        run: tauri build ${{ matrix.tauri-args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Collect artifacts ─────────────────────────────────────
      - name: Collect Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $outDir = "dist/${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $outDir
          # Installers
          Copy-Item "target/release/bundle/msi/*.msi"        $outDir -ErrorAction SilentlyContinue
          Copy-Item "target/release/bundle/nsis/*-setup.exe" $outDir -ErrorAction SilentlyContinue
          # Portable — requires WebView2 (pre-installed on Windows 10/11)
          Copy-Item "target/release/overfry.exe" "$outDir/Overfry-portable.exe" -ErrorAction SilentlyContinue

      - name: Collect Linux artifacts
        if: matrix.os == 'ubuntu-22.04'
        run: |
          outDir="dist/${{ matrix.label }}"
          mkdir -p "$outDir"
          cp target/release/bundle/deb/*.deb           "$outDir/" 2>/dev/null || true
          cp target/release/bundle/appimage/*.AppImage "$outDir/" 2>/dev/null || true
          cp target/release/bundle/rpm/*.rpm           "$outDir/" 2>/dev/null || true

      - name: Collect macOS artifacts
        if: startsWith(matrix.os, 'macos')
        run: |
          outDir="dist/${{ matrix.label }}"
          mkdir -p "$outDir"
          # DMG installer
          cp target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg "$outDir/" 2>/dev/null || true
          # Portable .app (zipped — run without installing)
          appDir="target/${{ matrix.rust-target }}/release/bundle/macos"
          if [ -d "$appDir" ]; then
            cd "$appDir"
            zip -r "$GITHUB_WORKSPACE/$outDir/Overfry-portable.app.zip" *.app
            cd "$GITHUB_WORKSPACE"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/${{ matrix.label }}/
          retention-days: 30

  # ── GitHub Release (tag pushes only) ─────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
